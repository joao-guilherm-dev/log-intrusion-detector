version: '3.8'

services:
  log-detector:
    build: .
    container_name: log-intrusion-detector
    environment:
      - WEBHOOK_URL=https://discord.com/api/webhooks/SEU_WEBHOOK_HERE
    volumes:
      - ./logs:/var/log
    restart: always

  log-simulator:
    image: alpine
    container_name: log-simulator
    volumes:
      - ./logs:/var/log
    command: >
      sh -c "
      echo 'Iniciando simulador de logs...';
      while true; do
        sleep 5;
        echo '2026-11-04 14:00:00 Failed password for invalid user admin from 192.168.1.100 port 44322 ssh2' >> /var/log/app-auth.log;
        echo '2026-11-04 14:00:01 GET /login?user=admin%27%20OR%201=1-- HTTP/1.1 200 from 10.0.0.5' >> /var/log/app-auth.log;
      done
      "
